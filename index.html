<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Сайт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__container">
      
      <div class="header__left">
        <div class="profile">
          <a href="https://t.me/animefnik" target="_blank" rel="noopener noreferrer" class="profile__avatar-wrapper" title="Открыть Telegram">
            <img src="photo1.jpg" alt="Animefnik" class="profile__avatar">
          </a>
          <span class="profile__name">Animefnik</span>
        </div>
      </div>

      <div class="header__center">
        <a href="#" class="logo">Festare</a>
      </div>

      <div class="header__right">
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>

    </div>
  </header>

  <nav class="sub-navbar">
    <div class="container sub-navbar__container">
      <button class="nav-btn active" id="btnHome">Главная</button>
      <button class="nav-btn" id="btnEmpty">Раздел</button>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      <section class="hero" id="mainView">
        <h1>Добро пожаловать</h1>
        <p>Основной контент страницы.</p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Festare. Все права защищены.</p>
    </div>
  </footer>

  <div class="cookie-banner" id="cookieBanner">
    <div class="cookie-banner__content">
      <p class="cookie-banner__text">
        Мы используем куки для улучшения работы сайта. Продолжая использовать сайт, вы соглашаетесь с этим.
      </p>
      <div class="cookie-banner__actions">
        <button class="btn btn--outline" id="cookieDecline">Отклонить</button>
        <button class="btn btn--primary" id="cookieAccept">Принять</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
