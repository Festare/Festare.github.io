mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true

profile:
  store-selected: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  proxy-server-nameserver:
    - https://8.8.8.8/dns-query#DIRECT
  nameserver:
    - https://8.8.8.8/dns-query#🌐 Прокси

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

proxies:
  - name: "🇷🇺 Без VPN"
    type: direct
    udp: true

proxy-groups:
  - name: 🌐 Прокси
    type: select
    remnawave:
      include-proxies: true
    proxies:
      - 🇷🇺 Без VPN
      - 🎲 Любой доступный сервер

  - name: 🎲 Любой доступный сервер
    type: fallback
    # exclude-filter: "США|Канада|Япония"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    hidden: true
    lazy: true
    remnawave:
      include-proxies: true
      shuffle-proxies-order: true

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,🌐 Прокси
