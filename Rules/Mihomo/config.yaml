mixed-port: 7890
allow-lan: false
mode: rule
log-level: silent
ipv6: true
tcp-concurrent: true
unified-delay: true

profile:
  store-selected: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  proxy-server-nameserver:
    - https://8.8.8.8/dns-query#DIRECT
  nameserver:
    - https://8.8.8.8/dns-query#🌐 Proxy

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53

proxies:
  - name: "🔄 DIRECT"
    type: direct
    udp: true

proxy-groups:
  - name: 🌐 Proxy
    type: select
    proxies:
      - 🔄 DIRECT
      - 🎲 Auto
    include-all-proxies: true

  - name: 🎲 Auto
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    hidden: true
    lazy: true
    include-all-proxies: true
    # exclude-filter: "США|Канада|Япония"

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,🌐 Proxy
